<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Link</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
        }
        .upload-form {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        .upload-form h2 {
            margin-bottom: 20px;
            text-align: center;
        }
        .upload-form input {
            width: 80%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .upload-form button {
            width: 80%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .upload-form button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="upload-form">
        <h2>Upload Link</h2>
        <input type="text" id="link" placeholder="Enter link" required>
        <button onclick="uploadLink()">Upload</button>
    </div>

    <script>
        function uploadLink() {
            const link = document.getElementById('link').value;
            const credentials = localStorage.getItem('credentials'); // 从 localStorage 获取鉴权信息

            if (!credentials) {
                alert('Please login first.');
                window.location.href = 'login.html';
                return;
            }

            // 发送 POST 请求到 Cloudflare Worker
            fetch('/api', {
                method: 'POST',
                headers: {
                    'Authorization': `Basic ${credentials}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ link })
            })
            .then(response => response.json())
            .then(data => {
                alert('Link uploaded successfully!');
                console.log(data);
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred. Please try again.');
            });
        }
    </script>
</body>
</html>
